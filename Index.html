<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Print Full Page Image</title>
  <style>
    /* Screen preview */
    html, body { margin: 0; background: #fff; }
    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .page img {
      max-width: 100%;
      height: auto;
    }

    /* Print sizing */
    @page {
      size: Letter;   /* change to A4 if needed */
      margin: 0;      /* edge-to-edge print (printer may still add margins) */
    }
    @media print {
      html, body { height: 100%; }
      .page {
        height: 100vh;
      }
      .page img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* fills the page */
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <img src="home.jpeg" alt="Full-page print image" />
  </div>
</body>
</html>
